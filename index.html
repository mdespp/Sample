<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NYS Shelter Standards Review</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="panel"><header class="header"><div><h1>NYS shelter standards review</h1><a href="aspca-nysstandardschecklist.pdf" target="_blank" rel="noopener">Original ASPCA checklist ↗</a></div><div class="exports"><label><input id="includeHistory" type="checkbox"> Include history</label><button id="exportExcel" type="button">Export Excel</button><button id="exportPdf" class="primary" type="button">Export PDF</button></div></header><div class="filter"><label for="category">Show category</label><select id="category"><option value="all">All categories</option></select><label for="reviewFilter">Show items</label><select id="reviewFilter"><option value="all">All items</option><option value="unreviewed">Not reviewed</option><option value="no">Needs attention (No)</option><option value="na">Not applicable</option><option value="yes">Reviewed (Yes)</option></select></div><div class="reviewTools"><span id="progressTotal" aria-live="polite"></span><button type="button" id="expandAll">Expand all</button><button type="button" id="collapseAll">Collapse all</button></div><div id="groups"></div><details id="notesSummary" class="notes-summary"><summary>Notes overview (<span id="notesCount">0</span>) — view, edit or delete notes</summary><div id="notesList"></div></details><div class="savebar"><div><strong id="unsaved">0 items with unsaved edits</strong><p id="notice" role="status"></p></div><button id="save" class="primary" disabled>Save changes</button></div><details class="history"><summary>Review change history (<span id="historyCount">0</span>)</summary><div id="history"></div></details></section></main><div id="dialog" class="overlay" hidden><form id="reviewForm" class="modal"><button type="button" class="close" id="close" aria-label="Close">×</button><h2>Confirm NYS review changes</h2><label>Your name<input id="reviewer" required placeholder="Enter your name" autocomplete="name"></label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Confirm save</button></div></form></div><script src="script.js"></script></body></html>
